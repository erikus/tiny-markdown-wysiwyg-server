<!doctype html>
<meta name="viewport" content="width=device-width">
<meta name="color-scheme" content="light dark">
<!--
  Caddy file_server browse template with an "edit" link next to every
  Markdown file, pointing at mdwebd. Replace EDIT_HOST with the host mdwebd is
  reachable on (its tsnet node name, e.g. edit.example.ts.net). The mdwebd
  --root NAMEs must match the first path segment of the URLs this file_server
  serves, e.g. `root * /srv/files` holding `/srv/files/notes` pairs with
  `--root notes=/home/me/notes`.

  .Path is the cleaned, percent-encoded request path of the listed directory
  with no trailing slash ("/" at the root, "/notes/sub" below it), so
  $.Path + "/" + .Name is the file's path relative to the file_server root.
  Files at the root itself get no link: mdwebd paths always start with a
  root name.
-->
<pre>
{{- range .Items}}
<a href="{{html .URL}}">{{html .Name}}</a>{{if and (.HasExt ".md" ".markdown") (ne $.Path "/")}}  <a href="https://EDIT_HOST/edit{{$.Path}}/{{html .Name}}">edit</a>{{end}}
{{- end}}
</pre>
